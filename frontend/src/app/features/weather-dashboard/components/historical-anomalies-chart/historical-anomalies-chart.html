<div class="chart-card">
  <div class="chart-header">
    <h3>Anomalías Climatológicas</h3>
    <mat-button-toggle-group [value]="activeMetric()" (change)="activeMetric.set($event.value)" aria-label="Seleccionar Métrica">
      <mat-button-toggle value="temp">Temperatura</mat-button-toggle>
      <mat-button-toggle value="prec">Precipitación</mat-button-toggle>
    </mat-button-toggle-group>
  </div>
  <div class="chart-container">
    <div echarts [options]="chartOption()" class="echarts-box"></div>
  </div>
</div>
