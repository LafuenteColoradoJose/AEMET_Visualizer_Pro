<mat-card class="chart-card">
  <mat-card-header class="chart-header">
    <mat-card-title>Anomalías Climatológicas</mat-card-title>
    
    <mat-button-toggle-group [value]="activeMetric()" (change)="activeMetric.set($event.value)" aria-label="Métrica">
      <mat-button-toggle value="temp">Temperatura</mat-button-toggle>
      <mat-button-toggle value="prec">Precipitación</mat-button-toggle>
    </mat-button-toggle-group>
  </mat-card-header>
  <mat-card-content class="chart-container">
    <div echarts [options]="chartOption()" [theme]="themeService.isDark() ? 'dark' : 'light'" class="echarts-box"></div>
  </mat-card-content>
</mat-card>
