<mat-card class="elevation-z4 chart-card">
  <mat-card-header>
    <mat-card-title>Mapa de Calor - Temperaturas Máximas ({{ year() }})</mat-card-title>
  </mat-card-header>
  <mat-card-content class="chart-content">
    <div echarts [options]="chartOption()" [theme]="themeService.isDark() ? 'dark' : 'light'" class="echart-container"></div>
  </mat-card-content>
</mat-card>
