<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav [mode]="isMobile() ? 'over' : 'side'" [opened]="!isMobile()" class="sidenav">
    <div class="sidenav-layout">
      <div>
        <mat-toolbar color="primary"><img src="logo.svg" alt="Logo" class="sidebar-logo"> AEMET Pro</mat-toolbar>
        <mat-nav-list>
          <a mat-list-item routerLink="/overview" routerLinkActive="active-link" (click)="closeOnMobile()">
            <mat-icon matListItemIcon>dashboard</mat-icon>
            <span matListItemTitle>Visión General</span>
          </a>
          <a mat-list-item routerLink="/yearly" routerLinkActive="active-link" (click)="closeOnMobile()">
            <mat-icon matListItemIcon>calendar_month</mat-icon>
            <span matListItemTitle>Análisis Anual</span>
          </a>
          <a mat-list-item routerLink="/predictions" routerLinkActive="active-link" (click)="closeOnMobile()">
            <mat-icon matListItemIcon>psychology</mat-icon>
            <span matListItemTitle>Laboratorio IA</span>
          </a>
          <a mat-list-item routerLink="/historical" routerLinkActive="active-link" (click)="closeOnMobile()">
            <mat-icon matListItemIcon>history</mat-icon>
            <span matListItemTitle>Tendencias Históricas</span>
          </a>
        </mat-nav-list>
      </div>
      
      <!-- Siempre visible al fondo, ahora con altura dinámica -->
      <div class="sidenav-footer">
        <div class="theme-toggle-container">
          <app-theme-toggle></app-theme-toggle>
        </div>
        
        <mat-divider></mat-divider>
        
        <div class="author-credits">
          <div class="developed-by">
            <mat-icon class="small-icon">code</mat-icon> Desarrollado por
          </div>
          <a class="author-name" href="https://www.joselafuente.dev" target="_blank" rel="noopener" aria-label="Portfolio de José Lafuente">
            José Lafuente
          </a>
          <div class="social-links">
            <a class="social-link" href="https://github.com/LafuenteColoradoJose" target="_blank" rel="noopener" aria-label="Perfil de GitHub" title="GitHub">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
              </svg>
            </a>
            <a class="social-link" href="https://www.linkedin.com/in/joselafuentecolorado" target="_blank" rel="noopener" aria-label="Perfil de LinkedIn" title="LinkedIn">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="top-toolbar">
      @if (isMobile()) {
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Abrir menú">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <!-- Selector Regional Global -->
      <app-station-selector></app-station-selector>
      
      <span class="spacer"></span>
    </mat-toolbar>
    
    <main class="content-container">
      <ng-content></ng-content>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
